name: GoVault
id: dev.txchen.govault
version: 0.7.0-beta.1

icon:
  png: assets/Icon.png

dev:
  target: native

build:
  output: ../../dist
  installers: false
  targets: [macos_arm64, macos_x64, linux_x64, linux_arm64, windows_x64, windows_arm64]

linux:
  # The desktop entry's menu category. Security alone is an additional
  # category desktop-file-validate wants beside Settings or System, and a
  # second main category lists the app twice, so the AppStream metadata
  # (linux/share/metainfo) adds Security instead.
  categories: [Utility]
  # Installed at /usr/share by the .deb and pacman packages and at the
  # AppImage's usr/share: the AppStream metadata, in place of NSGo's.
  share: linux/share

# gv, the command-line client, ships in every desktop package: signed in
# GoVault.app/Contents/MacOS, beside the executable on Windows and Linux,
# linked into /usr/bin by the .deb and pacman packages.
commands:
  - name: gv
    package: ../gv

windows:
  # Puts the installation directory, which holds gv.exe, on the user's Path.
  path: true

release:
  github: txchen/govault

updates:
  key: 6iugV37IcMOWY8WgrigDXu+OMdyasUYzUuTomJPWB2E=
  automatic: true
