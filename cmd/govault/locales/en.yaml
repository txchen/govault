  message: "{action, select, copyPassword {Enter your master password to copy the password.} copyTOTP {Enter your master password to copy the verification code.} revealTOTP {Enter your master password to reveal the verification code.} revealPassword {Enter your master password to reveal the password.} revealCardNumber {Enter your master password to reveal the card number.} copyCardNumber {Enter your master password to copy the card number.} revealSecurityCode {Enter your master password to reveal the security code.} copySecurityCode {Enter your master password to copy the security code.} revealSSN {Enter your master password to reveal the Social Security Number.} copySSN {Enter your master password to copy the Social Security Number.} revealField {Enter your master password to reveal the custom field.} copyField {Enter your master password to copy the custom field.} revealPrivateKey {Enter your master password to reveal the private key.} copyPrivateKey {Enter your master password to copy the private key.} revealOldPassword {Enter your master password to reveal the old password.} copyOldPassword {Enter your master password to copy the old password.} editItem {Enter your master password to edit the item.} cloneItem {Enter your master password to clone the item.} archiveItem {Enter your master password to archive the item.} unarchiveItem {Enter your master password to unarchive the item.} downloadAttachment {Enter your master password to download the attachment.} exportVault {Enter your master password to export your vault.} updateProtectedItem {Enter your master password to update a protected item.} other {Enter your master password to continue.}}"
