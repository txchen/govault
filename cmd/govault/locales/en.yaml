# GoVault's messages in English, the source language. docs/i18n.md explains
# how to translate them.

# Common words

cancel: Cancel
save: Save
delete: Delete
remove: Remove
edit:
  message: Edit
  description: A button or menu item that opens the selected item in the editor (verb).
restore:
  message: Restore
  description: A button or menu item that moves an item out of Trash (verb).
verify:
  message: Verify
  description: A button that checks a code or the master password (verb).
copy:
  message: Copy
  description: A button that copies a value to the clipboard (verb).
undo:
  message: Undo
  description: A button that takes back removing a passkey before the item is saved.
never:
  message: Never
  description: A choice for a timeout that never runs, such as auto-lock or clearing the clipboard.
notAvailable:
  message: "—"
  description: Shown in place of a value that is not known yet.

