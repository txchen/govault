ssoOpenBrowserAgain: Open browser again
togglePasswordVisibility:
  message: Toggle password visibility
  description: What screen readers say of the eye button beside a password field.

# Two-step login

twoFactorTitle: Two-step verification
twoFactorEnterEmailCodeTo: "Enter the code sent to {email}."
twoFactorEnterEmailCode: Enter the code sent to your email.
twoFactorEnterAuthenticatorCode: Enter the 6-digit code from your authenticator app.
twoFactorEnterYubiKey:
  message: Insert your YubiKey and touch it.
  description: Shown under the two-step login title when the YubiKey method is chosen. Touching the key's button makes it type a one-time code into the field.
twoFactorMethod:
  message: Verification method
  description: What screen readers say of the choice between two-step login methods, such as authenticator app, email and YubiKey.
twoFactorAuthenticator:
  message: Authenticator App
  description: The two-step login method that uses codes from an authenticator app.
twoFactorEmail:
  message: Email
  description: The two-step login method that emails a code.
twoFactorYubiKey:
  message: YubiKey
  description: A two-step login method; a brand name.
twoFactorDuo:
  message: Duo
  description: A two-step login method; a brand name.
twoFactorOrganizationDuo:
  message: Duo (Organization)
  description: Duo two-step login that an organization requires.
twoFactorU2F:
  message: FIDO U2F
  description: A two-step login method with a security key.
twoFactorWebAuthn:
  message: Passkey / WebAuthn
  description: A two-step login method with a passkey or security key.
twoFactorRememberedDevice:
  message: Remembered Device
  description: The two-step login method of a device the user chose to remember.
twoFactorOtherProvider:
  message: "Method {number, number, integer}"
  description: A two-step login method GoVault does not know, by its number.
verificationCode: Verification Code
rememberDevice: Remember this device
backToSignIn: Back to Sign In
sendCode: Send Code
resendCode: Resend Code
twoFactorFootnote: Two-step login keeps your vault safe even if your password leaks.
twoFactorCodeRequired: Enter the verification code.
twoFactorCodeInvalid: Invalid verification code. Check the code and try again.
twoFactorYubiKeyRequired:
  message: Touch your YubiKey to enter its code.
  description: Shown when the user chooses Verify with the YubiKey code field empty.
twoFactorYubiKeyMalformed:
  message: That is not a code from a YubiKey. Touch your YubiKey to enter a new one.
  description: Shown when the YubiKey code field holds text that is not a YubiKey one-time code, such as something typed by hand. Nothing was sent to the server.
twoFactorYubiKeyInvalid:
  message: The server did not accept this YubiKey code. Touch your YubiKey again to enter a new one.
  description: Shown when the server rejects a YubiKey one-time code, for example one already used. Each touch of the key makes a new code.
twoFactorYubiKeyNotRegistered:
  message: This YubiKey is not registered with your account. Use a YubiKey you added in your vault web settings.
  description: Shown when the server says the YubiKey that typed the code is not one of the account's keys.
twoFactorUnsupported:
  message: "This account requires two-step login with {methods}, which GoVault does not support yet. Enable Authenticator App, Email or YubiKey two-step login in your vault web settings to sign in here."
  description: methods lists the account's two-step login methods, separated by commas.
twoFactorEmailFailed:
  message: "Could not send the verification email. {reason}"
  description: reason is a sentence that says what went wrong.
twoFactorEmailSentTo: "A verification code was sent to {email}."
twoFactorEmailSent: A verification code was sent to your email.

# New device verification

newDeviceTitle:
  message: Verify your identity
  description: Title of the sign-in step where Bitwarden asks for a code it emailed because it does not recognize this device. Bitwarden's apps use the same words.
newDeviceEnterCodeTo:
  message: "Your server doesn’t recognize this device. Enter the code sent to {email}."
  description: Shown under the title of the new device verification step. email is the account's email address.
newDeviceCodeInvalid:
  message: Invalid or expired verification code. Check the code, or choose Resend Code to get a new one.
  description: Shown when the server rejects the emailed code. A code works only once and for a few minutes.
newDeviceFootnote:
  message: Bitwarden asks for this code on each new device for accounts without two-step login.
  description: The small print under the new device verification step.

