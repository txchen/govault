# Errors from the vault

errorTwoFactorRequired: Two-step login is required for this account.
errorUnauthorized: Invalid email or master password.
errorOffline: Server unreachable. Check your connection and server URL.
errorRedirect: The server redirected to another address, which GoVault does not follow.
errorNotFound: The server could not find this item. Sync and try again.
errorRevisionConflict: This item changed on another device. Sync and try again.
errorAttachmentTooLarge: Attachments are limited to 100 MiB.
errorArchiveUnsupported: This server does not support Archive. It needs Vaultwarden 1.36 or later.
errorPremiumRequired: Archive needs a premium membership.
errorAccountIDUnknown: Could not confirm your account ID with the server. Sync and try again.
errorArchiveNotConfirmed: The server did not confirm the change. GoVault synced to show where the item is now.
errorCipherInTrash: Items in Trash cannot be archived. Restore the item first.
errorLocked: The vault is locked. Unlock it and try again.
errorLoggedOut: You are not signed in.
errorCipherNotFound: This item is no longer in your vault.
errorFolderNotFound: This folder is no longer in your vault.
errorReadOnly: This item is read-only.
errorOrganizationKey: GoVault cannot read this organization’s items. Sync and try again.
errorAttachmentNotFound: This attachment is no longer in the item.
errorHiddenByOrganization: Your organization hides this item’s secrets.
errorUnsupportedUpload: The server asked for an attachment upload GoVault does not support.
errorServerMismatch: The saved sign-in belongs to a different server than this vault copy. Sign in again.
errorSignInRequired: Sign in again to sync. Your vault is available offline until then.
errorDifferentAccount: This signs in to a different account than the vault on this device. To use a different account, log out first.
errorSSOMasterPasswordRequired: This SSO account does not have a master password yet. Set one in the web vault first.
errorSSOForcePasswordReset: Your organization requires a master password reset. Reset your master password in the web vault first.
errorSSOKeyConnectorUnsupported: SSO with Key Connector is not supported yet.
errorSSOTrustedDeviceUnsupported: SSO with Trusted Device Encryption is not supported yet.
errorSSOCallbackPortUnavailable: Could not start the local SSO callback listener (ports 8065–8070 are in use).
errorSSOStateMismatch: The SSO callback could not be verified. Try signing in again.
errorAccountChanged: The account changed since this was confirmed. Try again.
errorSnapshotNotUpdated: The server has the change, but the copy on this device could not be updated. Sync to refresh it.
errorSealedField: This item holds encrypted data GoVault cannot copy to a new key.
errorUnsupportedCipher: This item is in a format GoVault cannot read yet.
errorChangedSinceReview: The item changed after you reviewed the import. Review it again.
errorRepromptRequired: Updating this protected item needs your master password.
errorUnsupportedType: GoVault cannot save this type of item yet.
errorAmbiguousUpdate: GoVault cannot tell which existing items the backup items are.
