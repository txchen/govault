serverURL: Server URL
email: Email
masterPassword: Master Password
masterPasswordPlaceholder:
  message: Master password
  description: The placeholder of the lock screen's password field.
required:
  message: Required
  description: The placeholder of a field that must be filled in.
emailPlaceholder:
  message: name@example.com
  description: An example email address in an empty email field. Use an address that looks natural in your language.
insecureServer: This server does not use HTTPS. Your master password and vault data are sent unencrypted; use it only on a network you trust.
signIn:
  message: Sign In
  description: The button that signs in to the server.
backToUnlock: Back to Unlock
signInFootnote: End-to-end encrypted. Your master password never leaves this device.
signInFieldsRequired: Server URL, email, and master password are required.
signInWithSSO:
  message: Sign in with SSO
  description: The secondary button on the sign-in screen that starts single sign-on in the browser.
orSignInWith:
  message: or
