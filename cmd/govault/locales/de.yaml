# Errors from the vault

errorTwoFactorRequired: Dieses Konto erfordert Zwei-Faktor-Authentifizierung.
errorUnauthorized: Ungültige E-Mail oder falsches Master-Passwort.
errorOffline: Server nicht erreichbar. Prüfe Verbindung und Server-URL.
errorRedirect: Der Server hat auf eine andere Adresse weitergeleitet; GoVault folgt keinen Weiterleitungen.
errorNotFound: Der Server konnte diesen Eintrag nicht finden. Synchronisiere und versuche es erneut.
errorRevisionConflict: Dieser Eintrag wurde auf einem anderen Gerät geändert. Synchronisiere und versuche es erneut.
errorAttachmentTooLarge: Anhänge dürfen höchstens 100 MiB groß sein.
errorArchiveUnsupported: Dieser Server unterstützt kein Archiv. Erfordert Vaultwarden 1.36 oder neuer.
errorPremiumRequired: Das Archiv erfordert eine Premium-Mitgliedschaft.
errorAccountIDUnknown: Deine Konto-ID konnte vom Server nicht bestätigt werden. Synchronisiere und versuche es erneut.
errorArchiveNotConfirmed: Der Server hat die Änderung nicht bestätigt. GoVault hat synchronisiert, um den aktuellen Stand anzuzeigen.
errorCipherInTrash: Einträge im Papierkorb können nicht archiviert werden. Stelle den Eintrag zuerst wieder her.
errorLocked: Der Tresor ist gesperrt. Entsperre ihn und versuche es erneut.
errorLoggedOut: Du bist nicht angemeldet.
errorCipherNotFound: Dieser Eintrag ist nicht mehr in deinem Tresor.
errorFolderNotFound: Dieser Ordner ist nicht mehr in deinem Tresor.
errorReadOnly: Dieser Eintrag ist schreibgeschützt.
errorOrganizationKey: GoVault kann die Einträge dieser Organisation nicht lesen. Synchronisiere und versuche es erneut.
errorAttachmentNotFound: Dieser Anhang ist nicht mehr im Eintrag vorhanden.
errorHiddenByOrganization: Deine Organisation blendet die Geheimnisse dieses Eintrags aus.
errorUnsupportedUpload: Der Server verlangt einen Anhang-Upload, den GoVault nicht unterstützt.
errorServerMismatch: Die gespeicherte Anmeldung gehört zu einem anderen Server als diese Tresorkopie. Melde dich erneut an.
errorSignInRequired: Zum Synchronisieren erneut anmelden. Bis dahin ist dein Tresor offline verfügbar.
errorDifferentAccount: Diese Anmeldung gehört zu einem anderen Konto als der Tresor auf diesem Gerät. Melde dich zuerst ab, um das Konto zu wechseln.
errorSSOMasterPasswordRequired: Dieses SSO-Konto hat noch kein Master-Passwort. Lege zuerst im Web-Tresor eines fest.
errorSSOForcePasswordReset: Deine Organisation erfordert das Zurücksetzen des Master-Passworts. Setze es zuerst im Web-Tresor zurück.
errorSSOKeyConnectorUnsupported: SSO mit Key Connector wird noch nicht unterstützt.
errorSSOTrustedDeviceUnsupported: SSO mit Trusted Device Encryption wird noch nicht unterstützt.
errorSSOCallbackPortUnavailable: Der lokale SSO-Callback-Listener konnte nicht gestartet werden (Ports 8065–8070 sind belegt).
errorSSOStateMismatch: Der SSO-Callback konnte nicht überprüft werden. Versuche dich erneut anzumelden.
errorAccountChanged: Das Konto hat sich seit der Bestätigung geändert. Versuche es erneut.
errorSnapshotNotUpdated: Der Server hat die Änderung, aber die lokale Kopie konnte nicht aktualisiert werden. Synchronisiere zum Aktualisieren.
errorSealedField: Dieser Eintrag enthält verschlüsselte Daten, die GoVault nicht auf einen neuen Schlüssel kopieren kann.
errorUnsupportedCipher: Dieser Eintrag hat ein Format, das GoVault noch nicht lesen kann.
errorChangedSinceReview: Der Eintrag wurde nach der Importprüfung geändert. Prüfe ihn erneut.
errorRepromptRequired: Zum Aktualisieren dieses geschützten Eintrags ist dein Master-Passwort erforderlich.
errorUnsupportedType: GoVault kann diesen Eintragstyp noch nicht speichern.
errorAmbiguousUpdate: GoVault kann nicht erkennen, welchen vorhandenen Einträgen die Backup-Einträge entsprechen.
errorUnreadablePasskey: Ein Passkey konnte nicht entschlüsselt werden.
errorWrongBackupPassword: Das Backup-Passwort ist falsch.
errorBackupTooLarge: Das verschlüsselte Backup wäre zu groß für den erneuten Import in GoVault.
