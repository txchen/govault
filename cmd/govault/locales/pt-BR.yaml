# Errors from the vault

errorTwoFactorRequired: Esta conta exige autenticação em duas etapas.
errorUnauthorized: E-mail ou senha principal inválidos.
errorOffline: Servidor inacessível. Verifique sua conexão e a URL do servidor.
errorRedirect: O servidor redirecionou para outro endereço; o GoVault não segue redirecionamentos.
errorNotFound: O servidor não encontrou este item. Sincronize e tente novamente.
errorRevisionConflict: Este item foi alterado em outro dispositivo. Sincronize e tente novamente.
errorAttachmentTooLarge: Os anexos têm limite de 100 MiB.
errorArchiveUnsupported: Este servidor não suporta Arquivo. Requer Vaultwarden 1.36 ou posterior.
errorPremiumRequired: O Arquivo exige uma assinatura Premium.
errorAccountIDUnknown: Não foi possível confirmar seu ID de conta com o servidor. Sincronize e tente novamente.
errorArchiveNotConfirmed: O servidor não confirmou a alteração. O GoVault sincronizou para mostrar onde o item está.
errorCipherInTrash: Itens na lixeira não podem ser arquivados. Restaure o item primeiro.
errorLocked: O cofre está bloqueado. Desbloqueie e tente novamente.
errorLoggedOut: Você não está conectado.
errorCipherNotFound: Este item não está mais no seu cofre.
errorFolderNotFound: Esta pasta não está mais no seu cofre.
errorReadOnly: Este item é somente leitura.
