errorAttachmentNotFound: Este anexo não está mais no item.
errorHiddenByOrganization: Sua organização oculta os segredos deste item.
errorUnsupportedUpload: O servidor solicitou um envio de anexo não suportado pelo GoVault.
errorServerMismatch: O login salvo pertence a um servidor diferente desta cópia do cofre. Entre novamente.
errorSignInRequired: Entre novamente para sincronizar. Até lá, seu cofre continua disponível offline.
errorDifferentAccount: Este login é de uma conta diferente da do cofre neste dispositivo. Para trocar de conta, saia primeiro.
errorSSOMasterPasswordRequired: Esta conta SSO ainda não tem uma senha principal. Defina uma primeiro no cofre web.
errorSSOForcePasswordReset: Sua organização exige a redefinição da senha principal. Redefina-a primeiro no cofre web.
errorSSOKeyConnectorUnsupported: SSO com Key Connector ainda não é compatível.
errorSSOTrustedDeviceUnsupported: SSO com criptografia de dispositivo confiável ainda não é compatível.
errorSSOCallbackPortUnavailable: Não foi possível iniciar o retorno local de SSO (as portas 8065–8070 estão em uso).
errorSSOStateMismatch: Não foi possível verificar o retorno do SSO. Tente entrar novamente.
errorAccountChanged: A conta mudou desde a confirmação. Tente novamente.
errorSnapshotNotUpdated: O servidor tem a alteração, mas a cópia neste dispositivo não pôde ser atualizada. Sincronize para atualizar.
errorSealedField: Este item contém dados criptografados que o GoVault não pode copiar para uma nova chave.
errorUnsupportedCipher: Este item está em um formato que o GoVault ainda não consegue ler.
errorChangedSinceReview: O item mudou depois que você revisou a importação. Revise novamente.
errorRepromptRequired: Atualizar este item protegido exige sua senha principal.
errorUnsupportedType: O GoVault ainda não pode salvar este tipo de item.
errorAmbiguousUpdate: O GoVault não consegue identificar a quais itens existentes correspondem os itens do backup.
errorUnreadablePasskey: Não foi possível descriptografar uma chave de acesso.
errorWrongBackupPassword: A senha do backup está incorreta.
errorBackupTooLarge: O backup criptografado seria grande demais para o GoVault reimportar.
