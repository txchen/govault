# Errors from the vault

errorTwoFactorRequired: Esta cuenta requiere autenticación en dos pasos.
errorUnauthorized: Correo electrónico o contraseña maestra no válidos.
errorOffline: Servidor inaccesible. Comprueba tu conexión y la URL del servidor.
errorRedirect: El servidor redirigió a otra dirección; GoVault no sigue redirecciones.
errorNotFound: El servidor no encontró este elemento. Sincroniza e inténtalo de nuevo.
errorRevisionConflict: Este elemento cambió en otro dispositivo. Sincroniza e inténtalo de nuevo.
errorAttachmentTooLarge: Los adjuntos tienen un límite de 100 MiB.
errorArchiveUnsupported: Este servidor no admite Archivo. Requiere Vaultwarden 1.36 o posterior.
errorPremiumRequired: El archivo requiere una suscripción Premium.
errorAccountIDUnknown: No se pudo confirmar tu ID de cuenta con el servidor. Sincroniza e inténtalo de nuevo.
errorArchiveNotConfirmed: El servidor no confirmó el cambio. GoVault sincronizó para mostrar dónde está el elemento.
errorCipherInTrash: Los elementos de la papelera no pueden archivarse. Restaura el elemento primero.
errorLocked: La caja fuerte está bloqueada. Desbloquéala e inténtalo de nuevo.
errorLoggedOut: No has iniciado sesión.
errorCipherNotFound: Este elemento ya no está en tu caja fuerte.
errorFolderNotFound: Esta carpeta ya no está en tu caja fuerte.
errorReadOnly: Este elemento es de solo lectura.
errorOrganizationKey: GoVault no puede leer los elementos de esta organización. Sincroniza e inténtalo de nuevo.
errorAttachmentNotFound: Este adjunto ya no está en el elemento.
errorHiddenByOrganization: Tu organización oculta los secretos de este elemento.
errorUnsupportedUpload: El servidor solicitó una carga de adjunto no compatible con GoVault.
errorServerMismatch: El inicio de sesión guardado pertenece a un servidor distinto al de esta copia. Inicia sesión de nuevo.
errorSignInRequired: Inicia sesión de nuevo para sincronizar. Mientras tanto tu caja fuerte está disponible sin conexión.
errorDifferentAccount: Esto inicia sesión en una cuenta distinta a la de la caja fuerte en este dispositivo. Para cambiar de cuenta, cierra sesión primero.
errorSSOMasterPasswordRequired: Esta cuenta SSO aún no tiene contraseña maestra. Configura una primero en la caja fuerte web.
errorSSOForcePasswordReset: Tu organización requiere restablecer la contraseña maestra. Restablécela primero en la caja fuerte web.
errorSSOKeyConnectorUnsupported: SSO con Key Connector aún no es compatible.
errorSSOTrustedDeviceUnsupported: SSO con cifrado de dispositivo de confianza aún no es compatible.
errorSSOCallbackPortUnavailable: No se pudo iniciar la escucha local de SSO (los puertos 8065–8070 están en uso).
errorSSOStateMismatch: No se pudo verificar la respuesta de SSO. Intenta iniciar sesión de nuevo.
errorAccountChanged: La cuenta cambió desde que se confirmó. Inténtalo de nuevo.
errorSnapshotNotUpdated: El servidor tiene el cambio, pero no se pudo actualizar la copia en este dispositivo. Sincroniza para actualizarla.
errorSealedField: Este elemento contiene datos cifrados que GoVault no puede copiar a una nueva clave.
errorUnsupportedCipher: Este elemento tiene un formato que GoVault aún no puede leer.
errorChangedSinceReview: El elemento cambió después de revisar la importación. Revísala de nuevo.
errorRepromptRequired: Actualizar este elemento protegido requiere tu contraseña maestra.
errorUnsupportedType: GoVault aún no puede guardar este tipo de elemento.
errorAmbiguousUpdate: GoVault no puede determinar a qué elementos existentes corresponden los de la copia.
errorUnreadablePasskey: No se pudo descifrar una clave de acceso.
errorWrongBackupPassword: La contraseña de la copia de seguridad es incorrecta.
errorBackupTooLarge: La copia cifrada sería demasiado grande para volver a importarla en GoVault.
