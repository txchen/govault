# Errors from the vault

errorTwoFactorRequired: Для этого аккаунта требуется двухэтапная аутентификация.
errorUnauthorized: Неверная эл. почта или мастер-пароль.
errorOffline: Сервер недоступен. Проверьте подключение и URL сервера.
errorRedirect: Сервер перенаправил на другой адрес; GoVault не переходит по перенаправлениям.
errorNotFound: Сервер не нашёл этот элемент. Синхронизируйте и повторите попытку.
errorRevisionConflict: Этот элемент был изменён на другом устройстве. Синхронизируйте и повторите попытку.
errorAttachmentTooLarge: Максимальный размер вложения — 100 MiB.
errorArchiveUnsupported: Этот сервер не поддерживает архив. Требуется Vaultwarden 1.36 или новее.
errorPremiumRequired: Для архива требуется подписка Premium.
errorAccountIDUnknown: Не удалось подтвердить ID аккаунта на сервере. Синхронизируйте и повторите попытку.
errorArchiveNotConfirmed: Сервер не подтвердил изменение. GoVault выполнил синхронизацию для обновления состояния.
errorCipherInTrash: Элементы в корзине нельзя архивировать. Сначала восстановите элемент.
errorLocked: Хранилище заблокировано. Разблокируйте его и повторите попытку.
errorLoggedOut: Вы не вошли в аккаунт.
errorCipherNotFound: Этого элемента больше нет в вашем хранилище.
errorFolderNotFound: Этой папки больше нет в вашем хранилище.
errorReadOnly: Этот элемент доступен только для чтения.
errorOrganizationKey: GoVault не может прочитать элементы этой организации. Синхронизируйте и повторите попытку.
errorAttachmentNotFound: Этого вложения больше нет в элементе.
errorHiddenByOrganization: Ваша организация скрывает секреты этого элемента.
errorUnsupportedUpload: Сервер запросил неподдерживаемый способ загрузки вложения.
errorServerMismatch: Сохранённый вход относится к другому серверу. Войдите снова.
errorSignInRequired: Войдите снова для синхронизации. Пока хранилище доступно офлайн.
errorDifferentAccount: Этот вход относится к другому аккаунту. Чтобы сменить аккаунт, сначала выйдите.
errorSSOMasterPasswordRequired: Для этого аккаунта SSO ещё не задан мастер-пароль. Сначала задайте его в веб-хранилище.
errorSSOForcePasswordReset: Ваша организация требует сбросить мастер-пароль. Сначала сбросьте его в веб-хранилище.
errorSSOKeyConnectorUnsupported: Вход через SSO с Key Connector пока не поддерживается.
errorSSOTrustedDeviceUnsupported: Вход через SSO с шифрованием доверенных устройств пока не поддерживается.
errorSSOCallbackPortUnavailable: Не удалось запустить локальный обработчик SSO (порты 8065–8070 заняты).
errorSSOStateMismatch: Не удалось проверить ответ SSO. Попробуйте войти снова.
errorAccountChanged: Аккаунт изменился после подтверждения. Повторите попытку.
errorSnapshotNotUpdated: Сервер сохранил изменение, но локальную копию обновить не удалось. Синхронизируйте для обновления.
errorSealedField: Этот элемент содержит зашифрованные данные, которые GoVault не может перенести под новый ключ.
errorUnsupportedCipher: Этот элемент имеет формат, который GoVault пока не поддерживает.
errorChangedSinceReview: Элемент изменился после просмотра импорта. Просмотрите снова.
errorRepromptRequired: Для обновления этого защищённого элемента требуется мастер-пароль.
