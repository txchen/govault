# Errors from the vault

errorTwoFactorRequired: 이 계정은 2단계 인증이 필요합니다.
errorUnauthorized: 이메일 또는 마스터 비밀번호가 올바르지 않습니다.
errorOffline: 서버에 연결할 수 없습니다. 네트워크 연결과 서버 URL을 확인하세요.
errorRedirect: 서버가 다른 주소로 리디렉션했습니다. GoVault는 리디렉션을 따르지 않습니다.
errorNotFound: 서버에서 이 항목을 찾을 수 없습니다. 동기화한 후 다시 시도하세요.
errorRevisionConflict: 다른 기기에서 이 항목이 변경되었습니다. 동기화한 후 다시 시도하세요.
errorAttachmentTooLarge: 첨부 파일은 최대 100 MiB까지 가능합니다.
errorArchiveUnsupported: 이 서버는 아카이브를 지원하지 않습니다. Vaultwarden 1.36 이상이 필요합니다.
errorPremiumRequired: 아카이브 기능은 프리미엄 멤버십이 필요합니다.
errorAccountIDUnknown: 서버에서 계정 ID를 확인할 수 없습니다. 동기화한 후 다시 시도하세요.
errorArchiveNotConfirmed: 서버가 변경 사항을 확인하지 못했습니다. 현재 위치를 표시하기 위해 다시 동기화했습니다.
errorCipherInTrash: 휴지통의 항목은 보관할 수 없습니다. 먼저 항목을 복원하세요.
errorLocked: 보관함이 잠겨 있습니다. 잠금을 해제한 후 다시 시도하세요.
errorLoggedOut: 로그인되어 있지 않습니다.
errorCipherNotFound: 이 항목은 더 이상 보관함에 없습니다.
errorFolderNotFound: 이 폴더는 더 이상 보관함에 없습니다.
errorReadOnly: 이 항목은 읽기 전용입니다.
errorOrganizationKey: GoVault가 이 조직의 항목을 읽을 수 없습니다. 동기화한 후 다시 시도하세요.
errorAttachmentNotFound: 이 첨부 파일은 더 이상 항목에 없습니다.
errorHiddenByOrganization: 조직에서 이 항목의 비밀 정보를 숨겼습니다.
errorUnsupportedUpload: 서버가 GoVault에서 지원하지 않는 첨부 파일 업로드 방식을 요청했습니다.
errorServerMismatch: 저장된 로그인 정보가 이 보관함 사본과 다른 서버의 것입니다. 다시 로그인하세요.
errorSignInRequired: 동기화하려면 다시 로그인하세요. 그전까지 보관함을 오프라인으로 사용할 수 있습니다.
errorDifferentAccount: 이 기기의 보관함과 다른 계정으로 로그인했습니다. 다른 계정을 사용하려면 먼저 로그아웃하세요.
errorSSOMasterPasswordRequired: 이 SSO 계정에는 아직 마스터 비밀번호가 설정되어 있지 않습니다. 먼저 웹 보관함에서 설정하세요.
errorSSOForcePasswordReset: 조직에서 마스터 비밀번호 재설정을 요구합니다. 먼저 웹 보관함에서 마스터 비밀번호를 재설정하세요.
errorSSOKeyConnectorUnsupported: Key Connector를 사용하는 SSO는 아직 지원하지 않습니다.
errorSSOTrustedDeviceUnsupported: 신뢰할 수 있는 기기 암호화를 사용하는 SSO는 아직 지원하지 않습니다.
errorSSOCallbackPortUnavailable: 로컬 SSO 콜백 리스너를 시작할 수 없습니다(포트 8065–8070 사용 중).
errorSSOStateMismatch: SSO 콜백을 확인할 수 없습니다. 다시 로그인해 보세요.
errorAccountChanged: 확인 이후 계정이 변경되었습니다. 다시 시도하세요.
errorSnapshotNotUpdated: 서버에는 변경 사항이 저장되었지만 이 기기의 사본을 업데이트하지 못했습니다. 동기화하여 새로 고치세요.
errorSealedField: 이 항목에는 GoVault가 새 키로 복사할 수 없는 암호화 데이터가 포함되어 있습니다.
errorUnsupportedCipher: 이 항목은 GoVault가 아직 읽을 수 없는 형식입니다.
errorChangedSinceReview: 가져오기를 검토한 후 항목이 변경되었습니다. 다시 검토하세요.
