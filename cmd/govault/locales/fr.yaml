# Errors from the vault

errorTwoFactorRequired: Ce compte nécessite une connexion en deux étapes.
errorUnauthorized: Adresse e-mail ou mot de passe principal invalide.
errorOffline: Serveur inaccessible. Vérifiez votre connexion et l’URL du serveur.
errorRedirect: Le serveur a redirigé vers une autre adresse ; GoVault ne suit pas les redirections.
errorNotFound: Le serveur n’a pas trouvé cet élément. Synchronisez et réessayez.
errorRevisionConflict: Cet élément a été modifié sur un autre appareil. Synchronisez et réessayez.
errorAttachmentTooLarge: Les pièces jointes sont limitées à 100 MiB.
errorArchiveUnsupported: Ce serveur ne prend pas en charge l’archive. Vaultwarden 1.36 ou supérieur est requis.
errorPremiumRequired: L’archive nécessite un abonnement Premium.
errorAccountIDUnknown: Impossible de confirmer votre identifiant de compte auprès du serveur. Synchronisez et réessayez.
errorArchiveNotConfirmed: Le serveur n’a pas confirmé la modification. GoVault a synchronisé pour afficher l’emplacement actuel.
errorCipherInTrash: Les éléments de la corbeille ne peuvent pas être archivés. Restaurez l’élément d’abord.
errorLocked: Le coffre est verrouillé. Déverrouillez-le et réessayez.
errorLoggedOut: Vous n’êtes pas connecté.
errorCipherNotFound: Cet élément ne se trouve plus dans votre coffre.
errorFolderNotFound: Ce dossier ne se trouve plus dans votre coffre.
errorReadOnly: Cet élément est en lecture seule.
errorOrganizationKey: GoVault ne peut pas lire les éléments de cette organisation. Synchronisez et réessayez.
errorAttachmentNotFound: Cette pièce jointe ne figure plus dans l’élément.
errorHiddenByOrganization: Votre organisation masque les secrets de cet élément.
errorUnsupportedUpload: Le serveur a demandé un envoi de pièce jointe non pris en charge par GoVault.
errorServerMismatch: La connexion enregistrée correspond à un autre serveur que cette copie du coffre. Reconnectez-vous.
errorSignInRequired: Reconnectez-vous pour synchroniser. Votre coffre reste accessible hors ligne en attendant.
errorDifferentAccount: Cette connexion correspond à un autre compte que le coffre sur cet appareil. Déconnectez-vous d’abord pour changer de compte.
errorSSOMasterPasswordRequired: Ce compte SSO n’a pas encore de mot de passe principal. Définissez-en un d’abord dans le coffre web.
errorSSOForcePasswordReset: Votre organisation exige la réinitialisation du mot de passe principal. Réinitialisez-le d’abord dans le coffre web.
