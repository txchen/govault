errorSSOStateMismatch: Impossible de vérifier le retour SSO. Essayez de vous reconnecter.
errorAccountChanged: Le compte a changé depuis la confirmation. Réessayez.
errorSnapshotNotUpdated: Le serveur a enregistré la modification, mais la copie locale n’a pas pu être mise à jour. Synchronisez pour actualiser.
